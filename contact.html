<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mouhammed Niah</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <main class="contact-container">
        <div class="contact-grid">
            
            <section class="contact-sidebar">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour au portfolio</a>
                <div class="header-content">
                    <span class="badge">Open for collaboration</span>
                    <h1>Parlons de votre <br><span class="text-gradient">Prochain Projet</span></h1>
                    <p>Data Analyste, je vous aide à transformer vos flux complexes en décisions claires.</p>
                </div>

                <div class="contact-methods">
                    <div class="method-item">
                        <div class="icon-box"><i class="fas fa-envelope"></i></div>
                        <div>
                            <label>Email professionnel</label>
                            <p>niahmouhammed99@gmail.com</p>
                        </div>
                    </div>

                    <div class="method-item">
                        <div class="icon-box"><i class="fab fa-linkedin-in"></i></div>
                        <div>
                            <label>LinkedIn</label>
                            <p><a href="https://www.linkedin.com/in/mouhammed-niah-12a476232/" style="text-decoration: none; color: white;">https://www.linkedin.com/in/mouhammed-niah-12a476232/</a></p>
                        </div>
                    </div>

                    <div class="method-item">
                        <div class="icon-box"><i class="fas fa-location-dot"></i></div>
                        <div>
                            <label>Localisation</label>
                            <p>Dakar, Sénégal (Remote Friendly)</p>
                        </div>
                    </div>
                </div>

                <div class="social-mini">
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </section>

            <section class="contact-form-wrapper">
                <div class="form-card">
                    <form action="https://formspree.io/f/xwvnledb" method="POST">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="full-name">Nom Complet</label>
                                <input type="text" id="full-name" name="name" placeholder="Ex: Amadou Diop" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email-address">Email Professionnel</label>
                            <input type="email" id="email-address" name="email" placeholder="amadou@entreprise.sn" required>
                        </div>

                        <div class="form-group">
                            <label for="service">Objet de la demande</label>
                            <select id="service" name="service">
                                <option value="reconciliation">Data Analyste</option>
                                <option value="fraud-detection">Détection de Fraude</option>
                                <option value="reconciliation">Data Scientiste</option>
                                <option value="reconciliation">Data Engenier</option>
                                <option value="bi-dashboard">Dashboard Power BI / SQL</option>
                                <option value="collaboration">Collaboration / Recrutement</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="message-content">Votre Message</label>
                            <textarea id="message-content" name="message" rows="6" placeholder="Comment puis-je vous aider ?" required></textarea>
                        </div>

                        <input type="text" name="_gotcha" style="display:none">

                        <button type="submit" class="btn-primary">
                            <span>Envoyer le message</span>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </main>

</body>
</html>
